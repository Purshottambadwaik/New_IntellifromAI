{% extends "base.html" %}
{% block title %}Sign Up — IntelliForm AI{% endblock %}

{% block content %}
<div class="container" style="display:flex; align-items:center; justify-content:center; min-height: calc(100vh - 80px);">
    <div class="card card-sm">
        <div class="card-header">
            <h1 class="gradient-text">Create Account</h1>
            <p>Start automating your form filling</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-input" placeholder="John Doe" required id="signup-name">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required id="signup-email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required id="signup-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="signup-submit">Create Account</button>
        </form>

        <div class="divider"></div>

        <div class="text-center">
            <a href="{{ url_for('auth.login') }}" class="link" style="font-size:14px;">Already have an account? Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
