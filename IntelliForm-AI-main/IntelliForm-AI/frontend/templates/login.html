{% extends "base.html" %}
{% block title %}Login — IntelliForm AI{% endblock %}

{% block content %}
<div class="container" style="display:flex; align-items:center; justify-content:center; min-height: calc(100vh - 80px);">
    <div class="card card-sm">
        <div class="card-header">
            <h1 class="gradient-text">Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required id="login-email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required id="login-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="login-submit">Sign In</button>
        </form>

        <div class="divider"></div>

        <div class="text-center">
            <a href="{{ url_for('auth.signup') }}" class="link" style="font-size:14px;">Create an account</a>
            <span style="color:var(--text-muted); margin:0 8px;">·</span>
            <a href="{{ url_for('auth.forgot') }}" class="link" style="font-size:14px;">Forgot password?</a>
        </div>
    </div>
</div>
{% endblock %}
